name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Récupérer le code
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # ----------------------------
      # 2. Installer Java 17 (pour Spring Boot)
      # ----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # ----------------------------
      # 3. Construire l'application Spring Boot
      # ----------------------------
      - name: Build Spring Boot app
        run: mvn clean package -DskipTests

      # ----------------------------
      # 4. Construire l'image Docker (FIX buildx)
      # ----------------------------
      - name: Build Docker image using buildx
        run: |
          docker buildx create --use
          docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/spring-app:latest . --load

      # ----------------------------
      # 5. Connexion à Docker Hub
      # ----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------
      # 6. Push l'image sur Docker Hub
      # ----------------------------
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:latest